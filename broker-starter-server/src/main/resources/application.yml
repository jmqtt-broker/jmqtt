server:
  port: ${server-port:8080}

# log相关配置
logging:
  config: classpath:logback-boot.xml

spring:
  application:
    name: jmqtt-server
  datasource:
    # mysql
    url: ${RDB_URL:jdbc:mysql://dev.jmqtt.com:3366/jmqtt?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${RDB_USERNAME:root}
    password: ${RDB_PASSWORD:zhibo2022}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # postgres
#    url: ${RDB_URL:jdbc:postgresql://dev.jmqtt.com:5432/zb_iot}
#    username: ${RDB_USERNAME:postgres}
#    password: ${RDB_PASSWORD:123456}
#    driver-class-name: org.postgresql.Driver
    # oracle
#    url: ${rdb-url:jdbc:oracle:thin:@odb.jmqtt.com:1521:helowin}
#    username: ${rdb-username:zhibo}
#    password: ${rdb-password:zhibo2023}
#    driverClassName: oracle.jdbc.driver.OracleDriver
  redis:
    host: ${redis-host:dev.jmqtt.com}
    port: ${redis-port:56379}
    password: ${redis-password:zhibo2022}
