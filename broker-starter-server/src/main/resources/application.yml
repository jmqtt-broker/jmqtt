jmqtt:
  broker:
    # 是否开启匿名访问、默认登录账号、默认登录密码，可通过重写AuthValid来校验登录
    anonymous-enable: ${anonymous-enable:false}
    user: ${user:jmqtt}
    pwd: ${pwd:jmqtt}
    mqtt5:
      # 是否使用服务端心跳周期
      use-server-keepalive: ${use-server-keepalive:false}
      default-keepalive: ${default-keepalive:15}
      # 服务端能同时处理的非qos0最大消息数，默认int最大值
      receive-maximum: ${receive-maximum:100}
      # 服务端能处理的最大packet长度，默认256M，也是mqtt报文数据最大长度（可变头 + payload）
      maximum-packet-size: ${maximum-packet-size:20000}
      # 主题别名最大值
      topic-alias-maximum: ${topic-alias-maximum:1024}
      # 服务端生成的clientId前缀，当客户端未设置clientId时，由服务端生成clientId返回
      client-id-prefix: ${client-id-prefix:JMQTT_CLIENT_}
      # 可选的服务端功能，通配符订阅、订阅标识符、共享订阅、保留消息、最大qos等级
      wildcard-subscription-available: ${wildcard-subscription-available:true}
      subscription-identifier-available: ${subscription-identifier-available:true}
      shared-subscription-available: ${shared-subscription-available:true}
      retain-available: ${retain-available:true}
      maximum-qos: ${maximum-qos:2}
    # 是否开启高性能模式，开启则使用内存缓存QOS1、2的过程消息
    high-performance: ${high-performance:true}
    # 数据存储仓库，默认mem为内存存储，可选redis、rdb，配置redis需要配置redis连接，配置rdb需要数据库连接
    store: ${store:mem}
    # 默认值true
    # store = rdb条件下，useDefaultRdb为true时，优先使用依赖方数据源，依赖方没有数据源使用rdb配置的数据源
    # useDefaultRdb为false时，使用rdb配置的数据源
    # useDefaultRdb、rdb配置缺省时，使用依赖方数据源，依赖方无数据源则启动报错
    useDefaultRdb: ${useDefaultRdb:false}
    rdb:
      driver: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://rdb.jmqtt.com:3306/jmqtt?characterEncoding=utf8&autoReconnect=true&failOverReadOnly=false&useSSL=false&serverTimezone=Asia/Shanghai
      username: root
      password: zhibo@2020
    # redis数据源，逻辑同rdb
    useDefaultRedis: false
    redis:
      redis-host: rdb.jmqtt.com
      redis-port: 56379
      redis-password: zhibo@2020
      database: 11
      max-wait-mills: 60000
      max-idle: 50
      min-idle: 20
      max-total: 200
    netty:
      tcp-port: ${tcp-port:1883}
      ssl-tcp-port: ${ssl-tcp-port:1884}
      websocket-port: ${websocket-port:8883}
      ssl-websocket-port: ${ssl-websocket-port:8884}
      ssl-key-store-type: ${ssl-key-store-type:PKCS12}
      ssl-key-file-path: ${ssl-key-file-path:conf/server.pfx}
      ssl-manager-pwd: ${ssl-manager-pwd:654321}
      ssl-store-pwd: ${ssl-store-pwd:654321}
      # 是否开启双向认证，校验客户端证书
      use-client-ca: ${useClientCa:false}
      use-epoll: true
      pooled-byte-buf-allocator-enable: true
    akka:
      # 是否开启Akka，开启后提高吞吐，集群环境下建议开启
      # Akka作用是将一个broker节点的消息同步到其他broker节点
      # 集群环境下，store为mem时，Akka必须开启
      enable: ${akka-enable:true}
      # 当前Akka集群系统名称
      system-name: ${akka-system-name:JMqttDispatcherSystem}
      # 其他节点可访问的ip和port，内网或docker环境部署时，填宿主机ip、port，或公网可访问到的地址也可以
      host: ${akka-host:10.0.0.6}
#      host: ${akka-host:server.natappfree.cc}
      port: ${akka-port:25251}
#      port: ${akka-port:41790}
      # 服务监听的ip，为空时默认为0.0.0.0，监听所有地址
      bind-host: ${akka-bind-host:}
      # 服务绑定的本地端口，为空时取akka.port
      bind-port: ${akka-bind-port:}
      # 当前节点角色，keeper节点存储集群所有在线客户端、保留消息、订阅关系等，worker只负责存储当前节点连接客户端相关数据
      # 集群环境建议至少3个种子节点，将3个种子节点设置为keeper角色，负责集群的数据维护，worker节点负责对外提供服务
      roles: ${akka-roles:keeper}
      # akka集群种子节点列表，集群环境下至少配置3个种子节点。种子节点可以重启
#      cluster-nodes: ${seed-nodes:127.0.0.1:25251}
      cluster-nodes: ${seed-nodes:10.0.0.15:25251,10.0.0.15:25252}
#      cluster-nodes: ${seed-nodes:h162827k90.iok.la:17420}

