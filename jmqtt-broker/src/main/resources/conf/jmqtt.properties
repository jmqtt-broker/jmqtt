# 是否开启匿名访问
anonymousEnable=false

# 默认账号密码
user=admin
pwd=admin

# max mqtt message size
maxMsgSize=524288

# 是否启用高性能消息处理，若启用，则mqtt的入栈，出栈过程消息会基于内存保存
highPerformance=false

# 是否开启tcp服务
startTcp=true
tcpPort=1883

# 是否开启tcp ssl 服务
startSslTcp=true
sslTcpPort=1884

# 集群模式：
# 1.基于发布订阅，集群主动push消息给Jmqtt; 2.基于poll，jmqtt主动从集群拉消息
clusterMode = 1
# 2.poll方式，一次从集群中最大拉取的消息数和拉取的间隔时间（单位：ms）
maxPollEventNum = 10
pollWaitInterval = 10

# 是否开启websocket服务,ws协议
startWebsocket=true
websocketPort=8883

# 是否开启websocket服务,wss协议
startSslWebsocket=true
sslWebsocketPort=8884

akkaEnable = false

store=mem

